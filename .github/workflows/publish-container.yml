# Reusable workflow: build and push a container image to GHCR.
# Callers pin to the staging branch (beta fleet — no v1 infra branch):
#   uses: Roxabi/.github/.github/workflows/publish-container.yml@staging
#
# release_please_component is accepted for caller convention parity and future
# extensibility (e.g. composing the default image_name). It is not consumed
# in the workflow body in this initial version.
#
# Private git deps: pass either secrets.git_token (a real secret, not a job
# output — GitHub strips those) or set git_auth so this job mints an app
# token and forwards it as BuildKit secret id=git_token. Never a build-arg.
# Callers that omit both are unchanged.

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full registry path, e.g. ghcr.io/roxabi/lyra"
        required: true
        type: string
      release_please_component:
        description: "Reserved — currently unused by this workflow; accepted for caller convention parity."
        required: false
        default: ""
        type: string
      dockerfile_path:
        description: "Path to the Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      build_context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      git_auth:
        description: "Mint a GitHub App token in this job and expose it as BuildKit secret id=git_token. A caller cannot mint upstream: GitHub drops job outputs that contain secrets."
        required: false
        type: boolean
        default: false
      app_id:
        description: "GitHub App ID. Used only when git_auth is true."
        required: false
        type: string
        default: ""
      git_auth_repositories:
        description: "Repositories the minted token may read. Used only when git_auth is true."
        required: false
        type: string
        default: ""
    secrets:
      git_token:
        description: "Optional pre-minted token, exposed only as BuildKit secret id=git_token. Ignored if it arrives empty (job outputs that contain secrets are stripped by GitHub)."
        required: false
      app_private_key:
        description: "GitHub App private key. Used only when git_auth is true."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same job as the build on purpose. create-github-app-token masks its
      # output, and the runner then refuses to export it ("Skip output
      # 'token' since it may contain secret"), so an upstream job cannot
      # hand the token over.
      - name: Mint a token for private git dependencies
        id: app
        if: inputs.git_auth
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: Roxabi
          repositories: ${{ inputs.git_auth_repositories }}

      - name: Stage BuildKit git token
        id: gitauth
        env:
          MINTED: ${{ steps.app.outputs.token }}
          PASSED: ${{ secrets.git_token }}
        run: |
          set -euo pipefail
          token="${MINTED:-}"
          if [ -z "$token" ]; then
            token="${PASSED:-}"
          fi
          if [ -n "$token" ]; then
            printf 'GIT_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract semver from tag
        id: strip
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # github.ref_name is e.g. "lyra/v0.3.0"; strip "<component>/v" → "0.3.0"
          full="${{ github.ref_name }}"
          version="${full#*/v}"
          major="${version%%.*}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - name: Metadata (staging branch)
        id: meta-staging
        if: github.ref == 'refs/heads/staging'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.9.0
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=staging
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push (staging branch)
        if: github.ref == 'refs/heads/staging'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta-staging.outputs.tags }}
          labels: ${{ steps.meta-staging.outputs.labels }}
          # oci-mediatypes=false keeps Docker schema 2 so HEALTHCHECK survives
          # (75beac2). Provenance attestations cannot be exported with that
          # flag (buildx, red since 2026-07-24), so disable them.
          outputs: type=image,oci-mediatypes=false
          provenance: false
          # secret-envs, not a build-arg: the value stays in the runner env
          # and is mounted only for the RUN that asks for id=git_token.
          # Omitted when neither a minted nor a passed token is present, so
          # callers that need neither do not get an empty-secret warning.
          secret-envs: ${{ steps.gitauth.outputs.enabled == 'true' && 'git_token=GIT_TOKEN' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata (release tag)
        id: meta-tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.9.0
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ steps.strip.outputs.version }}
            type=raw,value=${{ steps.strip.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push (release tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta-tag.outputs.tags }}
          labels: ${{ steps.meta-tag.outputs.labels }}
          # Same media-type constraint as the staging build above.
          outputs: type=image,oci-mediatypes=false
          provenance: false
          secret-envs: ${{ steps.gitauth.outputs.enabled == 'true' && 'git_token=GIT_TOKEN' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
